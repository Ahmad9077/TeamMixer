<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>قرعة لعبة سين جيم - ديوانية الجيران</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@500;700;800&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              jakarta: ['"Plus Jakarta Sans"', '"Noto Kufi Arabic"', "ui-sans-serif", "system-ui"],
            },
            boxShadow: {
              pulse: "0 24px 70px rgba(124, 58, 237, 0.14)",
              mint: "0 20px 50px rgba(52, 211, 153, 0.24)",
              pink: "0 20px 50px rgba(244, 114, 182, 0.20)",
            },
          },
        },
      };
    </script>
    <style>
      :root {
        color-scheme: light;
        --violet: #7c3aed;
        --pink: #f472b6;
        --mint: #34d399;
        --teal: #064e3b;
        --paper: #f4eadc;
      }

      body {
        font-family: "Plus Jakarta Sans", "Noto Kufi Arabic", ui-sans-serif, system-ui;
        background-color: var(--paper);
        background-image:
          radial-gradient(circle at 1px 1px, rgba(244, 114, 182, 0.24) 1.2px, transparent 0),
          linear-gradient(135deg, rgba(255, 251, 235, 0.78), rgba(244, 234, 220, 0.94) 45%, rgba(124, 58, 237, 0.08));
        background-size: 22px 22px, 100% 100%;
      }

      .screen {
        display: none;
      }

      .screen.active {
        display: block;
      }

      .wheel-wrap {
        filter: drop-shadow(0 30px 38px rgba(6, 78, 59, 0.18));
      }

      .wheel {
        transition: transform 4.5s cubic-bezier(0.16, 0.84, 0.25, 1);
        transform-origin: center;
      }

      .team-card {
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.96), rgba(255, 255, 255, 0.84)),
          radial-gradient(circle at top right, rgba(124, 58, 237, 0.16), transparent 32%);
      }

      .bottom-safe {
        padding-bottom: calc(92px + env(safe-area-inset-bottom));
      }
    </style>
  </head>
  <body class="min-h-screen text-slate-950">
    <div class="bottom-safe mx-auto flex min-h-screen w-full max-w-7xl flex-col px-4 py-5 sm:px-6 lg:px-8 lg:pb-8">
      <header class="mb-5 flex items-center justify-between rounded-full border border-white/80 bg-white/80 px-4 py-3 shadow-pulse backdrop-blur md:px-6">
        <div>
          <p class="text-xs font-extrabold uppercase text-[#064e3b]">ديوانية الجيران</p>
          <h1 class="font-['Noto_Kufi_Arabic'] text-xl font-extrabold text-[#7c3aed] md:text-3xl" dir="rtl">قرعة لعبة سين جيم</h1>
        </div>
        <nav class="hidden items-center gap-2 md:flex" aria-label="Primary">
          <button class="nav-btn rounded-full px-5 py-3 text-sm font-extrabold text-slate-600 transition hover:bg-violet-50" data-screen="setup">Setup</button>
          <button class="nav-btn rounded-full px-5 py-3 text-sm font-extrabold text-slate-600 transition hover:bg-violet-50" data-screen="randomize">Draw</button>
          <button class="nav-btn rounded-full px-5 py-3 text-sm font-extrabold text-slate-600 transition hover:bg-violet-50" data-screen="results">Results</button>
        </nav>
      </header>

      <main class="flex-1">
        <section id="setup" class="screen active">
          <div class="mb-6 grid gap-4 lg:grid-cols-[0.9fr_1.1fr] lg:items-end">
            <div>
              <p class="mb-2 text-sm font-extrabold uppercase text-[#f472b6]">Three source groups</p>
              <h2 class="font-['Noto_Kufi_Arabic'] text-4xl font-extrabold leading-tight md:text-5xl" dir="rtl">قرعة لعبة سين جيم<br />ديوانية الجيران</h2>
            </div>
            <div class="rounded-[2rem] bg-white/85 p-5 shadow-pulse backdrop-blur">
              <div class="flex flex-wrap items-center justify-between gap-3">
                <div>
                  <p class="text-sm font-extrabold text-slate-500">Total players</p>
                  <p id="totalPlayers" class="text-3xl font-extrabold text-[#064e3b]">0</p>
                </div>
                <button id="shuffleQueueBtn" class="rounded-full bg-[#064e3b] px-5 py-3 text-sm font-extrabold text-white shadow-mint transition hover:scale-[1.02]">Start Draw</button>
              </div>
            </div>
          </div>

          <div id="poolGrid" class="grid gap-4 lg:grid-cols-3"></div>
        </section>

        <section id="randomize" class="screen">
          <div class="grid gap-6 lg:grid-cols-[0.78fr_1.22fr] lg:items-center">
            <aside class="rounded-[2rem] bg-white/90 p-5 shadow-pulse backdrop-blur">
              <p class="text-sm font-extrabold uppercase text-[#7c3aed]">Current draw</p>
              <h2 id="upNextName" class="mt-2 min-h-12 text-4xl font-extrabold">No player queued</h2>
              <p id="upNextPool" class="mt-2 text-sm font-bold text-slate-500">Add players or start the draw.</p>

              <div class="mt-6 grid grid-cols-2 gap-3">
                <div class="rounded-[1.75rem] bg-violet-50 p-4">
                  <p class="text-xs font-extrabold uppercase text-[#7c3aed]">Team 1</p>
                  <p id="alphaProgress" class="mt-2 text-2xl font-extrabold">0/0</p>
                </div>
                <div class="rounded-[1.75rem] bg-emerald-50 p-4">
                  <p class="text-xs font-extrabold uppercase text-[#064e3b]">Team 2</p>
                  <p id="betaProgress" class="mt-2 text-2xl font-extrabold">0/0</p>
                </div>
              </div>

              <button id="spinBtn" class="mt-6 w-full rounded-full bg-gradient-to-r from-[#7c3aed] via-[#f472b6] to-[#34d399] px-6 py-4 text-base font-extrabold text-white shadow-pink transition hover:scale-[1.02] disabled:cursor-not-allowed disabled:opacity-50">SPIN NAME</button>
              <p id="spinStatus" class="mt-4 min-h-6 text-center text-sm font-extrabold text-slate-500"></p>
            </aside>

            <div class="relative mx-auto aspect-square w-full max-w-[560px]">
              <div class="absolute left-1/2 top-0 z-20 h-0 w-0 -translate-x-1/2 border-l-[20px] border-r-[20px] border-t-[38px] border-l-transparent border-r-transparent border-t-[#064e3b] drop-shadow-lg"></div>
              <div class="wheel-wrap h-full w-full rounded-full bg-white p-4 shadow-pulse">
                <svg id="wheelSvg" class="wheel h-full w-full rounded-full" viewBox="0 0 320 320" role="img" aria-label="Name draw spin wheel"></svg>
              </div>
              <div class="pointer-events-none absolute inset-0 m-auto flex h-32 w-32 items-center justify-center rounded-full border-[10px] border-white bg-[#064e3b] text-center font-['Noto_Kufi_Arabic'] text-lg font-extrabold text-white shadow-mint" dir="rtl">سين<br />جيم</div>
            </div>
          </div>
        </section>

        <section id="results" class="screen">
          <div class="mb-6 flex flex-col justify-between gap-4 md:flex-row md:items-end">
            <div>
              <p class="mb-2 text-sm font-extrabold uppercase text-[#34d399]">Final results</p>
              <h2 class="text-4xl font-extrabold leading-tight md:text-5xl">Final teams, ready to play.</h2>
            </div>
            <div class="flex gap-3">
              <button id="shareBtn" class="rounded-full bg-[#7c3aed] px-5 py-3 text-sm font-extrabold text-white shadow-pulse transition hover:scale-[1.02]">Share Results</button>
              <button id="startOverBtn" class="rounded-full bg-white px-5 py-3 text-sm font-extrabold text-[#064e3b] shadow-mint transition hover:scale-[1.02]">Start Over</button>
            </div>
          </div>

          <div class="grid gap-5 lg:grid-cols-2">
            <article class="team-card rounded-[2rem] p-5 shadow-pulse">
              <div class="mb-4 flex items-center justify-between">
                <h3 class="text-3xl font-extrabold text-[#7c3aed]">Team 1</h3>
                <span id="alphaCount" class="rounded-full bg-violet-100 px-4 py-2 text-sm font-extrabold text-[#7c3aed]">0 players</span>
              </div>
              <div id="alphaList" class="grid gap-3"></div>
            </article>
            <article class="team-card rounded-[2rem] p-5 shadow-pulse">
              <div class="mb-4 flex items-center justify-between">
                <h3 class="text-3xl font-extrabold text-[#064e3b]">Team 2</h3>
                <span id="betaCount" class="rounded-full bg-emerald-100 px-4 py-2 text-sm font-extrabold text-[#064e3b]">0 players</span>
              </div>
              <div id="betaList" class="grid gap-3"></div>
            </article>
          </div>
        </section>
      </main>
    </div>

    <nav class="fixed inset-x-0 bottom-0 z-50 border-t border-white/80 bg-white/90 px-4 pb-[calc(12px+env(safe-area-inset-bottom))] pt-3 shadow-[0_-14px_40px_rgba(15,23,42,0.10)] backdrop-blur md:hidden" aria-label="Mobile">
      <div class="mx-auto grid max-w-md grid-cols-3 gap-2">
        <button class="nav-btn rounded-full px-3 py-3 text-xs font-extrabold text-slate-600" data-screen="setup">Setup</button>
        <button class="nav-btn rounded-full px-3 py-3 text-xs font-extrabold text-slate-600" data-screen="randomize">Draw</button>
        <button class="nav-btn rounded-full px-3 py-3 text-xs font-extrabold text-slate-600" data-screen="results">Results</button>
      </div>
    </nav>

    <script src="app.js"></script>
  </body>
</html>
